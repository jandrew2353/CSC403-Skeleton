
name: Dice Roller CI

on:
  push:
  pull_request:

jobs:
  dice-roller:
    runs-on: ubuntu-latest

    steps:
      # Get repository code
      - name: Checkout Dice Roller
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Test Dice Roller
      - name: Test Dice Roller
        run: python -m pytest test_main.py -v

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t dice-roller .